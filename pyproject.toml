[project]
name = "whoop-mcp"
version = "0.1.0"
description = "MCP server for WHOOP fitness tracker recovery data"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx",
    "pydantic>=2.0",
    "python-dotenv",
]

[project.scripts]
whoop-mcp = "whoop_mcp.server:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whoop_mcp"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
]
